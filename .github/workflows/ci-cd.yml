name: CI/CD

on:
  pull_request:
    branches:
      - main
      - master
      - dev
  push:
    branches:
      - main
      - master
      - dev

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew compileJava

      - name: Test
        run: ./gradlew test

      - name: Build Spring Boot jar
        run: ./gradlew bootJar

      - name: Build Docker image
        run: docker build -t dori-community-be:${{ github.sha }} .

      - name: Configure AWS credentials
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to Amazon ECR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag dori-community-be:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION
          script: |
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            docker rm -f dori-community-be || true
            docker run -d \
              --name dori-community-be \
              --network dori-net \
              --env-file ~/dori/.env \
              -p 127.0.0.1:8080:8080 \
              "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/actuator/health; then
                echo "Health check succeeded"
                docker image prune -f
                exit 0
              fi

              echo "Waiting for application health check... ($i/30)"
              sleep 3
            done

            echo "Health check failed"
            docker logs dori-community-be
            exit 1

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: build
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Send deployment result
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_RESULT: ${{ needs.build.result }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          if [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS="succeeded"
          else
            STATUS="failed"
          fi

          MESSAGE="[Dori Community] Backend deployment $STATUS\nRepository: $REPOSITORY\nBranch: $BRANCH\nCommit: ${COMMIT_SHA:0:7}\nActions: $RUN_URL"
          curl --fail --show-error --silent \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg content "$MESSAGE" '{content: $content}')" \
            "$DISCORD_WEBHOOK_URL"
