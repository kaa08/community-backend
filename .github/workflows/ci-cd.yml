name: CI/CD

on:
  pull_request:
    branches:
      - main
      - master
      - dev
  push:
    branches:
      - main
      - master
      - dev

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test deployment rollback script
        run: ruby tests/deploy_rollback_test.rb

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew compileJava

      - name: Test
        run: ./gradlew test

      - name: Build Spring Boot jar
        run: ./gradlew bootJar

      - name: Build Docker image
        run: docker build -t dori-community-be:${{ github.sha }} .

      - name: Configure AWS credentials
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to Amazon ECR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag dori-community-be:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION
          command_timeout: 15m
          script: |
            bash -se <<'DEPLOY_SCRIPT'
            set -euo pipefail

            CONTAINER=dori-community-be
            NEW_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            PREVIOUS_IMAGE=""

            for command in aws docker curl flock; do
              command -v "$command" > /dev/null
            done

            # Keep the lock until deployment or recovery has finished.
            exec 9> "$HOME/dori/deploy.lock"
            if ! flock -n 9; then
              echo "Another backend deployment is in progress."
              exit 1
            fi

            test -r "$HOME/dori/.env"
            docker network inspect dori-net > /dev/null

            CURRENT_CONTAINER=$(docker ps -aq --filter "name=^/${CONTAINER}$")
            if [ -n "$CURRENT_CONTAINER" ]; then
              PREVIOUS_IMAGE=$(docker inspect --format '{{.Image}}' "$CONTAINER")
              docker image inspect "$PREVIOUS_IMAGE" > /dev/null
              echo "Previous image ID: $PREVIOUS_IMAGE"
              if ! curl -fsS --connect-timeout 2 --max-time 5 \
                http://localhost:8080/actuator/health > /dev/null; then
                echo "Existing backend is unhealthy; choose a recovery image manually."
                exit 1
              fi
            fi

            # Finish authentication and download before stopping the service.
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$NEW_IMAGE"

            start_container() {
              docker run -d \
                --name "$CONTAINER" \
                --network dori-net \
                --env-file "$HOME/dori/.env" \
                -p 127.0.0.1:8080:8080 \
                "$1"
            }

            wait_for_health() {
              for i in $(seq 1 30); do
                if curl -fsS --connect-timeout 2 --max-time 5 \
                  http://localhost:8080/actuator/health; then
                  echo "Health check succeeded"
                  return 0
                fi
                echo "Waiting for application health check... ($i/30)"
                if [ "$i" -lt 30 ]; then
                  sleep 3
                fi
              done
              return 1
            }

            if [ -n "$PREVIOUS_IMAGE" ]; then
              docker rm -f "$CONTAINER"
            fi

            if start_container "$NEW_IMAGE" && wait_for_health; then
              echo "Deployment succeeded: $NEW_IMAGE"
              exit 0
            fi

            echo "Deployment failed: $NEW_IMAGE"
            docker logs --tail 100 "$CONTAINER" || true

            # A failed docker run can still leave a container with this name.
            CURRENT_CONTAINER=$(docker ps -aq --filter "name=^/${CONTAINER}$")
            if [ -n "$CURRENT_CONTAINER" ]; then
              docker rm -f "$CONTAINER"
            fi

            if [ -z "$PREVIOUS_IMAGE" ]; then
              echo "No previous image is available; manual recovery is required."
              exit 1
            fi

            echo "Rolling back to image ID: $PREVIOUS_IMAGE"
            if start_container "$PREVIOUS_IMAGE" && wait_for_health; then
              echo "Rollback succeeded. The new deployment is still marked as failed."
            else
              echo "Rollback failed; manual recovery is required."
              docker logs --tail 100 "$CONTAINER" || true
            fi

            exit 1
            DEPLOY_SCRIPT

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: build
    if: always() && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Send deployment result
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_RESULT: ${{ needs.build.result }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          if [ "$DEPLOY_RESULT" = "success" ]; then
            TITLE="Backend deployment succeeded"
            COLOR=5763719
          else
            TITLE="Backend deployment failed"
            COLOR=15548997
          fi

          DESCRIPTION=$(printf 'Repository: `%s`\nBranch: `%s`\nCommit: `%s`' "$REPOSITORY" "$BRANCH" "${COMMIT_SHA:0:7}")
          curl --fail --show-error --silent \
            -H "Content-Type: application/json" \
            --data "$(jq -n \
              --arg title "$TITLE" \
              --arg description "$DESCRIPTION" \
              --arg url "$RUN_URL" \
              --argjson color "$COLOR" \
              '{embeds: [{title: $title, description: $description, color: $color, url: $url, footer: {text: "GitHub Actions"}}], allowed_mentions: {parse: []}}')" \
            "$DISCORD_WEBHOOK_URL"
